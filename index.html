<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квадрант Імпульсу</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --yes-bg: #ecfdf5;
      --yes-border: #a7f3d0;
      --yes-text: #065f46;
      --radius: 20px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9375rem;
      color: var(--muted);
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .progress { margin-bottom: 24px; }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }

    .bar {
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.03);
      margin-bottom: 20px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .card .text {
      font-size: 1.125rem;
      font-weight: 550;
      letter-spacing: -0.02em;
      line-height: 1.45;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ans {
      appearance: none;
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .ans:hover {
      border-color: #c7c9d1;
      background: #fafbfc;
    }

    .ans:active { transform: scale(0.985); }

    .ans.primary {
      border-color: var(--yes-border);
      background: var(--yes-bg);
      color: var(--yes-text);
    }

    .ans.primary:hover {
      border-color: #6ee7b7;
      background: #d1fae5;
    }

    #quiz.hide { display: none; }
    #result { display: none; }
    #result.show { display: block; }

    .result-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.03);
      text-align: center;
    }

    .result-card .eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .result-card .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .result-card .body {
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.65;
      text-align: left;
      margin-bottom: 16px;
    }

    .result-card .note {
      font-size: 0.875rem;
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .reset-wrap {
      margin-top: 20px;
      text-align: center;
    }

    .btn-reset {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .btn-reset:hover {
      color: var(--text);
      background: #eef0f4;
    }

    .actions { display: flex; justify-content: center; }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
      background: #eef0f4;
      color: var(--text);
    }

    .btn:hover { filter: brightness(0.97); }
    .btn:active { transform: scale(0.97); }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .page { padding: 24px 16px 48px; }
      .card .text { font-size: 1.05rem; }
      .result-card .title { font-size: 1.35rem; }
    }
  </style>
</head>

      1: {
        name: "Імпульс Знань",
        text: "Тобі близька логіка, алгоритми та глибокий аналіз. У профілі інформатики ти будеш багато працювати зі структурами даних, алгоритмами та розв’язанням складних задач. Уміння бачити структуру задачі — одна з найцінніших навичок в IT. У ліцеї «Імпульс» ми даємо міцну базу і реальні проєкти."
      },
      2: {
        name: "Імпульс Ідей",
        text: "Ти мислиш креативно і хочеш створювати. В інформатиці це дизайн інтерфейсів, геймдизайн, візуалізація та мультимедіа. У профілі ти зможеш поєднувати технології з творчістю і робити продукти, які не тільки працюють, а й подобаються людям."
      },
      3: {
        name: "Імпульс Команди",
        text: "Тобі важливо працювати разом і створювати спільний результат. Сучасна інформатика — це майже завжди командна розробка. У профілі ти навчишся не лише технічним речам, а й тому, як ефективно співпрацювати, ділити завдання і доводити проєкт до кінця."
      },
      4: {
        name: "Імпульс Майбутнього",
        text: "Тебе тягне до нового: штучний інтелект, дані, кібербезпека, технології, які тільки з’являються. У профілі інформатики ти зможеш досліджувати ці напрями і розуміти, куди рухається світ. Ліцей «Імпульс» готує не просто користувачів технологій, а тих, хто буде їх створювати."
      }
    };

    let current = 0;
    let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };

    // Перемішуємо питання, щоб імпульси не йшли блоками
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let order = shuffle(QUESTIONS);

    function showQuestion() {
      const q = order[current];
      document.getElementById('qNum').textContent = 'Питання ' + (current + 1);
      document.getElementById('qText').textContent = q.text;
      document.getElementById('stepLabel').textContent = 'Питання ' + (current + 1) + ' з ' + order.length;
      const pct = Math.round((current / order.length) * 100);
      document.getElementById('pctLabel').textContent = pct + '%';
      document.getElementById('progress').style.width = pct + '%';
    }

    function answer(points) {
      scores[order[current].impulse] += points;
      current++;
      if (current >= order.length) finish();
      else showQuestion();
    }

    function finish() {
      document.getElementById('quiz').classList.add('hide');
      document.getElementById('result').classList.add('show');
      document.getElementById('progress').style.width = '100%';
      document.getElementById('pctLabel').textContent = '100%';

      const total = scores[1] + scores[2] + scores[3] + scores[4];
      const note = document.getElementById('resSecondary');

      if (total === 0) {
        document.getElementById('resName').textContent = 'Відкритий старт';
        document.getElementById('resText').textContent =
          'Зараз жоден із напрямів не відгукнувся сильно. Це нормально — інтереси часто проявляються вже в процесі. Інформатика в ліцеї «Імпульс» широка: логіка, креатив, командна робота і нові технології. Приходь і спробуй сам, що саме зачепить.';
        note.style.display = 'none';
        return;
      }

      let maxImp = 1;
      for (let i = 2; i <= 4; i++) {
        if (scores[i] > scores[maxImp]) maxImp = i;
      }

      const leaders = [];
      for (let i = 1; i <= 4; i++) {
        if (scores[i] === scores[maxImp]) leaders.push(i);
      }

      if (leaders.length > 1) {
        const names = leaders.map(i => IMPULSES[i].name).join(', ');
        document.getElementById('resName').textContent = 'Кілька імпульсів';
        document.getElementById('resText').textContent =
          'У тебе близькі одразу кілька напрямів: ' + names +
          '. Це сильна комбінація для інформатики — саме на перетині логіки, ідей, команди та майбутніх технологій народжуються цікаві проєкти. У ліцеї «Імпульс» ти зможеш розвивати їх разом.';
        note.style.display = 'none';
        return;
      }

      let second = null, secondScore = -1;
      for (let i = 1; i <= 4; i++) {
        if (i !== maxImp && scores[i] > secondScore) {
          secondScore = scores[i];
          second = i;
        }
      }

      const main = IMPULSES[maxImp];
      document.getElementById('resName').textContent = main.name;
      document.getElementById('resText').textContent = main.text;

      if (second && secondScore > 0) {
        note.style.display = 'block';
        note.textContent = 'Також помітний у тебе ' + IMPULSES[second].name.toLowerCase() + '. Це добре поєднання для інформатики.';
      } else {
        note.style.display = 'none';
      }
    }

    function restart() {
      current = 0;
      scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      order = shuffle(QUESTIONS);
      document.getElementById('result').classList.remove('show');
      document.getElementById('quiz').classList.remove('hide');
      showQuestion();
    }

    showQuestion();
  </script>
</body>
</html>
